# Gate Camera Agent — Configuration
# Run: python gate_camera_agent.py
# Requirements: pip install requests

[server]
# URL of the WeighbridgeSetu cloud server (no trailing slash)
url = https://weighbridgesetu.com

# Agent key — copy from Settings → Gate Cameras in the web app (Generate → Copy)
agent_key = PASTE_AGENT_KEY_HERE

# How often to push a snapshot (seconds). 3 s = ~20 frames/min on the live feed
interval_seconds = 3

# HTTP timeout per request (seconds)
timeout_seconds = 5

[entry]
enabled = true
# CP Plus ONVIF snapshot URL — replace with your camera's local IP
snapshot_url = http://192.168.1.64/onvif-http/snapshot?Profile_1
username = admin
password = your_camera_password

[exit]
# Set enabled = true and fill in details when you have an exit camera
enabled = false
snapshot_url = http://192.168.1.65/onvif-http/snapshot?Profile_1
username = admin
password = your_camera_password
